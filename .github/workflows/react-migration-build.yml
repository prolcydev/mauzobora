name: React migration build
on:
  push:
    branches: [react-migration]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
      - name: Verify application output
        run: test -s dist/index.html && test -s dist/legacy-app.html && test -s dist/landing.html
